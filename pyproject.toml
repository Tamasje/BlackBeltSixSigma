[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bbtools"
version = "0.1.0"
description = "Offline Six Sigma Black Belt exam toolkit: inventory merge, calculator workbook and course index"
requires-python = ">=3.11"
dependencies = ["openpyxl", "numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "libreoffice: recalculates a workbook with LibreOffice headless (soffice); fails, never skips, if it is missing",
]
